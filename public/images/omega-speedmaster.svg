<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cccccc"/>
      <stop offset="100%" stop-color="#777777"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- Straps -->
  <rect x="230" y="40" width="140" height="130" fill="#151515" stroke="#333"/>
  <rect x="230" y="430" width="140" height="130" fill="#151515" stroke="#333"/>

  <!-- Case -->
  <circle cx="300" cy="300" r="170" fill="url(#silver)"/>
  <circle cx="300" cy="300" r="150" fill="#111" stroke="url(#silver)" stroke-width="4"/>

  <!-- Dial -->
  <circle cx="300" cy="300" r="130" fill="#090909"/>

  <!-- Chrono Sub-dials -->
  <circle cx="240" cy="300" r="32" fill="#181818" stroke="#333" stroke-width="1.5"/>
  <circle cx="360" cy="300" r="32" fill="#181818" stroke="#333" stroke-width="1.5"/>
  <circle cx="300" cy="360" r="32" fill="#181818" stroke="#333" stroke-width="1.5"/>

  <!-- Omega Logo & Text -->
  <path d="M 292,230 C 292,220 308,220 308,230 C 308,236 292,236 292,230 Z" fill="none" stroke="#d4af37" stroke-width="3"/>
  <text x="300" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">OMEGA</text>
  <text x="300" y="262" font-family="Arial, sans-serif" font-size="8" fill="#d4af37" text-anchor="middle" letter-spacing="1">SPEEDMASTER</text>
  <text x="300" y="272" font-family="Arial, sans-serif" font-size="7" fill="#888" text-anchor="middle">PROFESSIONAL</text>

  <!-- Hands -->
  <g transform="rotate(310 300 300)">
    <polygon points="300,180 296,290 304,290" fill="#fff"/>
  </g>
  <g transform="rotate(130 300 300)">
    <polygon points="300,190 297,290 303,290" fill="#fff"/>
  </g>
  <!-- Red Chrono Second Hand -->
  <line x1="300" y1="175" x2="300" y2="330" stroke="#e53e3e" stroke-width="2"/>
  <circle cx="300" cy="300" r="5" fill="#e53e3e"/>
</svg>