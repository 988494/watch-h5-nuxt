<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1f1a17"/>
      <stop offset="100%" stop-color="#0a0807"/>
    </radialGradient>
    <linearGradient id="gold-santos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf0cd"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6d1c"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- Leather Strap -->
  <rect x="230" y="40" width="140" height="130" fill="#3d2314" stroke="#26140a"/>
  <rect x="230" y="430" width="140" height="130" fill="#3d2314" stroke="#26140a"/>

  <!-- Square Case -->
  <rect x="170" y="170" width="260" height="260" rx="35" fill="url(#gold-santos)" stroke="#5e4912" stroke-width="3"/>

  <!-- Square Bezel with Screws -->
  <rect x="195" y="195" width="210" height="210" rx="25" fill="#fdfbf7" stroke="url(#gold-santos)" stroke-width="6"/>

  <!-- Bezel Screws -->
  <circle cx="215" cy="215" r="4" fill="#8a6d1c"/>
  <circle cx="385" cy="215" r="4" fill="#8a6d1c"/>
  <circle cx="215" cy="385" r="4" fill="#8a6d1c"/>
  <circle cx="385" cy="385" r="4" fill="#8a6d1c"/>

  <!-- Roman Numerals -->
  <text x="300" y="240" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#111" text-anchor="middle">XII</text>
  <text x="375" y="308" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#111" text-anchor="middle">III</text>
  <text x="300" y="375" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#111" text-anchor="middle">VI</text>
  <text x="225" y="308" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#111" text-anchor="middle">IX</text>

  <!-- Cartier Brand Text -->
  <text x="300" y="265" font-family="Georgia, serif" font-size="15" font-style="italic" font-weight="bold" fill="#222" text-anchor="middle">Cartier</text>
  <text x="300" y="278" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle" letter-spacing="1">AUTOMATIC</text>

  <!-- Blue Sword Hands -->
  <g transform="rotate(120 300 300)">
    <polygon points="300,230 295,295 305,295" fill="#1d4ed8"/>
  </g>
  <g transform="rotate(330 300 300)">
    <polygon points="300,200 296,295 304,295" fill="#1d4ed8"/>
  </g>
  <circle cx="300" cy="300" r="5" fill="#1d4ed8"/>
</svg>