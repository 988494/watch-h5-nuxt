<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#242220"/>
      <stop offset="100%" stop-color="#0e0d0c"/>
    </radialGradient>
    <linearGradient id="rose-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7d0b7"/>
      <stop offset="50%" stop-color="#e09d77"/>
      <stop offset="100%" stop-color="#9e5a36"/>
    </linearGradient>
    <radialGradient id="ap-dial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f242d"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- Bracelet -->
  <path d="M220 40 L380 40 L360 170 L240 170 Z" fill="url(#rose-gold)"/>
  <path d="M220 560 L380 560 L360 430 L240 430 Z" fill="url(#rose-gold)"/>

  <!-- AP Octagonal Bezel -->
  <polygon points="250,140 350,140 430,220 430,380 350,460 250,460 170,380 170,220" fill="url(#rose-gold)" stroke="#824623" stroke-width="3"/>

  <!-- 8 Hexagonal Screws on Bezel -->
  <circle cx="260" cy="155" r="7" fill="#222" stroke="url(#rose-gold)" stroke-width="1.5"/>
  <circle cx="340" cy="155" r="7" fill="#222" stroke="url(#rose-gold)" stroke-width="1.5"/>
  <circle cx="415" cy="230" r="7" fill="#222" stroke="url(#rose-gold)" stroke-width="1.5"/>
  <circle cx="415" cy="370" r="7" fill="#222" stroke="url(#rose-gold)" stroke-width="1.5"/>
  <circle cx="340" cy="445" r="7" fill="#222" stroke="url(#rose-gold)" stroke-width="1.5"/>
  <circle cx="260" cy="445" r="7" fill="#222" stroke="url(#rose-gold)" stroke-width="1.5"/>
  <circle cx="185" cy="370" r="7" fill="#222" stroke="url(#rose-gold)" stroke-width="1.5"/>
  <circle cx="185" cy="230" r="7" fill="#222" stroke="url(#rose-gold)" stroke-width="1.5"/>

  <!-- Inner Bezel Ring -->
  <circle cx="300" cy="300" r="135" fill="url(#ap-dial)" stroke="url(#rose-gold)" stroke-width="2"/>

  <!-- Tapisserie Grid Pattern (AP Signature Grid) -->
  <g opacity="0.15" stroke="#e09d77" stroke-width="1">
    <path d="M170 200 H430 M170 220 H430 M170 240 H430 M170 260 H430 M170 280 H430 M170 300 H430 M170 320 H430 M170 340 H430 M170 360 H430 M170 380 H430 M170 400 H430"/>
    <path d="M200 170 V430 M220 170 V430 M240 170 V430 M260 170 V430 M280 170 V430 M300 170 V430 M320 170 V430 M340 170 V430 M360 170 V430 M380 170 V430 M400 170 V430"/>
  </g>

  <!-- Logo AP -->
  <text x="300" y="240" font-family="Cinzel, Georgia, serif" font-size="20" font-weight="bold" fill="url(#rose-gold)" text-anchor="middle">AP</text>
  <text x="300" y="258" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#f7d0b7" text-anchor="middle" letter-spacing="1">AUDEMARS PIGUET</text>
  <text x="300" y="360" font-family="Arial, sans-serif" font-size="9" fill="#a0a0a0" text-anchor="middle" letter-spacing="2">AUTOMATIC</text>

  <!-- Date Window -->
  <rect x="380" y="287" width="26" height="26" fill="#111" stroke="url(#rose-gold)" stroke-width="1"/>
  <text x="393" y="305" font-family="Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle">08</text>

  <!-- Hands -->
  <g transform="rotate(290 300 300)">
    <polygon points="300,210 295,295 305,295" fill="url(#rose-gold)"/>
  </g>
  <g transform="rotate(60 300 300)">
    <polygon points="300,180 295,295 305,295" fill="url(#rose-gold)"/>
  </g>
  <circle cx="300" cy="300" r="7" fill="url(#rose-gold)"/>
</svg>