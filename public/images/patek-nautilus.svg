<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#161b26"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </radialGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6ecf2"/>
      <stop offset="50%" stop-color="#9aa4b2"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="patek-dial" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="50%" stop-color="#0f233a"/>
      <stop offset="100%" stop-color="#050d18"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <!-- Integrated Steel Bracelet -->
    <path d="M220 50 L380 50 L360 180 L240 180 Z" fill="url(#steel)"/>
    <path d="M220 550 L380 550 L360 420 L240 420 Z" fill="url(#steel)"/>
    <!-- Bracelet lines -->
    <line x1="230" y1="100" x2="370" y2="100" stroke="#778899" stroke-width="2"/>
    <line x1="235" y1="140" x2="365" y2="140" stroke="#778899" stroke-width="2"/>
    <line x1="230" y1="500" x2="370" y2="500" stroke="#778899" stroke-width="2"/>
    <line x1="235" y1="460" x2="365" y2="460" stroke="#778899" stroke-width="2"/>

    <!-- Nautilus Rounded Cushion Case -->
    <path d="M 210,180 Q 300,165 390,180 Q 435,300 390,420 Q 300,435 210,420 Q 165,300 210,180 Z" fill="url(#steel)" stroke="#8a99ad" stroke-width="4"/>

    <!-- Ears / Hinges -->
    <path d="M 160,270 C 150,270 150,330 160,330 L 180,330 L 180,270 Z" fill="url(#steel)"/>
    <path d="M 440,270 C 450,270 450,330 440,330 L 420,330 L 420,270 Z" fill="url(#steel)"/>

    <!-- Inner Bezel -->
    <path d="M 225,195 Q 300,183 375,195 Q 412,300 375,405 Q 300,417 225,405 Q 188,300 225,195 Z" fill="#0d1826" stroke="url(#steel)" stroke-width="6"/>

    <!-- Dial Surface -->
    <path d="M 235,205 Q 300,195 365,205 Q 398,300 365,395 Q 300,405 235,395 Q 202,300 235,205 Z" fill="url(#patek-dial)"/>

    <!-- Horizontal Dial Grooves -->
    <line x1="210" y1="230" x2="390" y2="230" stroke="#2c527a" stroke-width="2" opacity="0.7"/>
    <line x1="205" y1="250" x2="395" y2="250" stroke="#2c527a" stroke-width="2" opacity="0.7"/>
    <line x1="202" y1="270" x2="398" y2="270" stroke="#2c527a" stroke-width="2" opacity="0.7"/>
    <line x1="200" y1="290" x2="390" y2="290" stroke="#2c527a" stroke-width="2" opacity="0.7"/>
    <line x1="200" y1="310" x2="390" y2="310" stroke="#2c527a" stroke-width="2" opacity="0.7"/>
    <line x1="202" y1="330" x2="398" y2="330" stroke="#2c527a" stroke-width="2" opacity="0.7"/>
    <line x1="205" y1="350" x2="395" y2="350" stroke="#2c527a" stroke-width="2" opacity="0.7"/>
    <line x1="210" y1="370" x2="390" y2="370" stroke="#2c527a" stroke-width="2" opacity="0.7"/>

    <!-- Date Window at 3 o'clock -->
    <rect x="345" y="287" width="28" height="26" rx="2" fill="#fff" stroke="#aaa" stroke-width="1"/>
    <text x="359" y="306" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">18</text>

    <!-- Hour Baton Markers -->
    <rect x="294" y="212" width="12" height="22" rx="3" fill="#fff" stroke="url(#steel)" stroke-width="1.5"/>
    <rect x="294" y="366" width="12" height="22" rx="3" fill="#fff" stroke="url(#steel)" stroke-width="1.5"/>
    <rect x="215" y="294" width="22" height="12" rx="3" fill="#fff" stroke="url(#steel)" stroke-width="1.5"/>

    <!-- Dial Text -->
    <text x="300" y="258" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">PATEK PHILIPPE</text>
    <text x="300" y="272" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle" letter-spacing="2">GENEVE</text>

    <!-- Hands -->
    <!-- Hour Hand -->
    <g transform="rotate(100 300 300)">
      <rect x="295" y="225" width="10" height="75" rx="4" fill="#fff" stroke="url(#steel)" stroke-width="2"/>
    </g>
    <!-- Minute Hand -->
    <g transform="rotate(340 300 300)">
      <rect x="296" y="190" width="8" height="110" rx="3" fill="#fff" stroke="url(#steel)" stroke-width="2"/>
    </g>
    <!-- Second Hand -->
    <g transform="rotate(230 300 300)">
      <line x1="300" y1="180" x2="300" y2="330" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="300" cy="300" r="4" fill="#cbd5e1"/>
    </g>
  </g>
</svg>