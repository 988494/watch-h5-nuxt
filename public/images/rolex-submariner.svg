<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e2530"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e0aa"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#113e2b"/>
      <stop offset="100%" stop-color="#051a11"/>
    </linearGradient>
    <radialGradient id="dial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c2e21"/>
      <stop offset="100%" stop-color="#03120c"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <rect width="600" height="600" fill="url(#bg)"/>
  
  <g filter="url(#glow)">
    <!-- Straps Top & Bottom -->
    <path d="M230 40 L370 40 L350 160 L250 160 Z" fill="#222" stroke="#333" stroke-width="2"/>
    <path d="M230 560 L370 560 L350 440 L250 440 Z" fill="#222" stroke="#333" stroke-width="2"/>
    <line x1="250" y1="80" x2="350" y2="80" stroke="#111" stroke-width="4"/>
    <line x1="250" y1="520" x2="350" y2="520" stroke="#111" stroke-width="4"/>

    <!-- Case Outer -->
    <circle cx="300" cy="300" r="170" fill="url(#gold)"/>
    <!-- Crown -->
    <rect x="465" y="275" width="20" height="50" rx="4" fill="url(#gold)"/>
    <path d="M465 260 L475 275 L475 325 L465 340 Z" fill="#b89128"/>

    <!-- Bezel Ceramic -->
    <circle cx="300" cy="300" r="150" fill="url(#bezel)" stroke="url(#gold)" stroke-width="3"/>
    
    <!-- Bezel Markers -->
    <circle cx="300" cy="158" r="6" fill="#fff"/>
    <text x="300" y="445" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f3e0aa" text-anchor="middle">30</text>
    <text x="160" y="306" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f3e0aa" text-anchor="middle">45</text>
    <text x="440" y="306" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f3e0aa" text-anchor="middle">15</text>

    <!-- Dial Surface -->
    <circle cx="300" cy="300" r="125" fill="url(#dial)"/>

    <!-- Hour Markers -->
    <polygon points="300,185 292,205 308,205" fill="#fff" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="300" cy="410" r="8" fill="#fff" stroke="url(#gold)" stroke-width="2"/>
    <rect x="180" y="293" width="16" height="14" rx="2" fill="#fff" stroke="url(#gold)" stroke-width="2"/>
    
    <!-- Date window at 3 o'clock -->
    <rect x="385" y="287" width="26" height="26" rx="3" fill="#fff"/>
    <text x="398" y="306" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">28</text>

    <!-- Circle hour markers -->
    <circle cx="215" cy="215" r="7" fill="#fff" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="385" cy="215" r="7" fill="#fff" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="215" cy="385" r="7" fill="#fff" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="385" cy="385" r="7" fill="#fff" stroke="url(#gold)" stroke-width="2"/>
    <rect x="238" y="188" width="10" height="18" fill="#fff" stroke="url(#gold)" stroke-width="1.5" transform="rotate(30 243 197)"/>
    <rect x="352" y="188" width="10" height="18" fill="#fff" stroke="url(#gold)" stroke-width="1.5" transform="rotate(-30 357 197)"/>

    <!-- Dial Texts -->
    <text x="300" y="240" font-family="Cinzel, Georgia, serif" font-size="14" font-weight="bold" fill="#f3e0aa" text-anchor="middle" letter-spacing="2">ROLEX</text>
    <text x="300" y="255" font-family="Arial, sans-serif" font-size="9" fill="#ccc" text-anchor="middle" letter-spacing="1">OYSTER PERPETUAL</text>
    <text x="300" y="350" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#4de896" text-anchor="middle" letter-spacing="1">SUBMARINER</text>
    <text x="300" y="365" font-family="Arial, sans-serif" font-size="8" fill="#aaa" text-anchor="middle">1000ft = 300m</text>
    <text x="300" y="376" font-family="Arial, sans-serif" font-size="7" fill="#aaa" text-anchor="middle">SUPERLATIVE CHRONOMETER</text>

    <!-- Hands -->
    <!-- Hour Hand Mercedes -->
    <g transform="rotate(220 300 300)">
      <rect x="296" y="210" width="8" height="90" fill="url(#gold)"/>
      <circle cx="300" cy="235" r="10" fill="url(#gold)"/>
      <circle cx="300" cy="235" r="6" fill="#fff"/>
    </g>
    <!-- Minute Hand -->
    <g transform="rotate(45 300 300)">
      <polygon points="300,180 295,290 305,290" fill="url(#gold)"/>
      <line x1="300" y1="190" x2="300" y2="285" stroke="#fff" stroke-width="3"/>
    </g>
    <!-- Second Hand -->
    <g transform="rotate(110 300 300)">
      <line x1="300" y1="170" x2="300" y2="330" stroke="url(#gold)" stroke-width="2"/>
      <circle cx="300" cy="210" r="5" fill="#fff" stroke="url(#gold)" stroke-width="1.5"/>
    </g>
    <!-- Center Cap -->
    <circle cx="300" cy="300" r="6" fill="url(#gold)"/>
  </g>
</svg>