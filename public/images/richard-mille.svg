<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2a1010"/>
      <stop offset="100%" stop-color="#0a0303"/>
    </radialGradient>
    <linearGradient id="red-carbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3333"/>
      <stop offset="50%" stop-color="#b30000"/>
      <stop offset="100%" stop-color="#400000"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- Rubber Strap -->
  <path d="M220 30 L380 30 L350 150 L250 150 Z" fill="#e63946"/>
  <path d="M220 570 L380 570 L350 450 L250 450 Z" fill="#e63946"/>

  <!-- Tonneau Case Outer (RM Signature Shape) -->
  <path d="M 210,120 Q 300,90 390,120 Q 430,300 390,480 Q 300,510 210,480 Q 170,300 210,120 Z" fill="url(#red-carbon)" stroke="#ff4d4d" stroke-width="4"/>

  <!-- Inner Bezel -->
  <path d="M 230,145 Q 300,120 370,145 Q 405,300 370,455 Q 300,480 230,455 Q 195,300 230,145 Z" fill="#111115" stroke="#ff3333" stroke-width="2"/>

  <!-- Skeleton Movements (Gears & Bridge) -->
  <circle cx="300" cy="300" r="80" fill="none" stroke="#d4af37" stroke-width="6" stroke-dasharray="15,8"/>
  <circle cx="300" cy="300" r="50" fill="none" stroke="#888" stroke-width="4"/>
  <polygon points="300,200 330,280 270,280" fill="none" stroke="#ff3333" stroke-width="3"/>
  <polygon points="300,400 340,320 260,320" fill="none" stroke="#ff3333" stroke-width="3"/>

  <!-- RM Text -->
  <text x="300" y="190" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">RICHARD MILLE</text>
  <text x="300" y="210" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ff4d4d" text-anchor="middle">RM 35-02 RAFAEL NADAL</text>

  <!-- Yellow/Red Skeleton Hands -->
  <g transform="rotate(40 300 300)">
    <polygon points="300,170 292,290 308,290" fill="#ffcc00" stroke="#000" stroke-width="1.5"/>
  </g>
  <g transform="rotate(200 300 300)">
    <polygon points="300,190 294,290 306,290" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
  </g>
  <circle cx="300" cy="300" r="8" fill="#ffcc00"/>
</svg>